<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkron | Yeni Kayıt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #f8fafc;
            padding: 2rem 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.4); }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }
        .form-control:disabled {
            background: rgba(255, 255, 255, 0.01);
            border-color: transparent;
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px #0ea5e9;
        }
        .btn-primary:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .brand-logo { font-weight: 800; letter-spacing: 3px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card glass-card p-4 p-sm-5">
                    <div class="card-body p-0">
                        <div class="text-center mb-4">
                            <h2 class="brand-logo mb-1">SENKRON</h2>
                            <p class="text-secondary small text-uppercase fw-bold">Yeni Sürücü Kaydı</p>
                        </div>
                        
                        <form id="registerForm">
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-secondary fw-bold">Ad</label>
                                    <input type="text" class="form-control" id="ad" placeholder="Adınız" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-uppercase text-secondary fw-bold">Soyad</label>
                                    <input type="text" class="form-control" id="soyad" placeholder="Soyadınız" disabled required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-secondary fw-bold">E-posta</label>
                                <input type="email" class="form-control" id="mail" placeholder="ornek@mail.com" disabled required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small text-uppercase text-secondary fw-bold">Plaka No</label>
                                <input type="text" class="form-control" id="plaka" placeholder="34 ABC 123" disabled required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-secondary fw-bold">Şifre</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control" id="sifre" placeholder="••••••••" disabled required style="padding-right: 70px;">
                                    <button type="button" id="toggleSifre" class="btn position-absolute top-50 end-0 translate-middle-y text-info fw-bold" style="background: transparent; border: none; box-shadow: none; font-size: 0.85rem; padding-right: 15px;">Göster</button>
                                </div>
                                <div id="capsWarningRegister" class="text-warning small mt-1 d-none" style="font-size: 0.75rem;">
                                    ⚠️ Uyarı: Caps Lock Açık!
                                </div>
                                <div class="progress mt-2 d-none" id="strengthProgress" style="height: 5px; background: rgba(255,255,255,0.08);">
                                    <div class="progress-bar" id="strengthBar" role="progressbar" style="width: 0%; transition: all 0.3s;"></div>
                                </div>
                                <div id="strengthText" class="small mt-1" style="font-size: 0.75rem;"></div>

                                <div id="passwordHelp" class="form-text text-secondary opacity-75 mt-2" style="font-size: 0.75rem;">
                                    * Şifreniz en az 8 karakter, 1 büyük harf ve 1 rakam içermelidir.
                                </div>
                            </div>

                            <button type="submit" id="regBtn" class="btn btn-primary w-100" disabled>Kayıt İşlemini Tamamla</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <span class="text-secondary small">Zaten hesabınız var mı?</span><br>
                            <a href="login.html" class="text-info text-decoration-none small fw-bold mt-1 d-inline-block">← Giriş ekranına dön</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. INPUTLARIN SIRAYLA AÇILMASI VE PLAKA BÜYÜK HARF (ÖNERİ 4) ---
        const fields = [
            document.getElementById('ad'),
            document.getElementById('soyad'),
            document.getElementById('mail'),
            document.getElementById('plaka'),
            document.getElementById('sifre'),
            document.getElementById('regBtn')
        ];

        fields.forEach((el, index) => {
            if(index < fields.length - 1) {
                el.addEventListener('input', () => {
                    // ÖNERİ 4: Plaka girilirken anlık otomatik büyük harfe çevirme
                    if(el.id === 'plaka') {
                        el.value = el.value.toUpperCase();
                    }

                    const nextEl = fields[index + 1];
                    let isValid = el.value.trim().length >= 2;
                    
                    if(el.id === 'mail') {
                        isValid = el.value.includes('@') && el.value.length > 5;
                    }

                    if(isValid) {
                        nextEl.disabled = false;
                    } else {
                        for(let i = index + 1; i < fields.length; i++) {
                            fields[i].disabled = true;
                            if(fields[i].tagName === "INPUT") fields[i].value = "";
                        }
                        if(el.id === 'plaka') {
                            document.getElementById('strengthProgress').classList.add('d-none');
                            document.getElementById('strengthText').innerText = '';
                        }
                    }
                });
            }
        });

        // --- ÖNERİ 2: ŞİFRE GÜÇLÜLÜK KONTROLÜ ---
        const sifreInput = document.getElementById('sifre');
        const strengthProgress = document.getElementById('strengthProgress');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        sifreInput.addEventListener('input', () => {
            const val = sifreInput.value;
            if (val.length > 0) {
                strengthProgress.classList.remove('d-none');
            } else {
                strengthProgress.classList.add('d-none');
                strengthText.innerText = '';
                return;
            }

            let passed = 0;
            if (val.length >= 8) passed++;
            if (/[A-Z]/.test(val)) passed++;
            if (/\d/.test(val)) passed++;

            if (passed === 1) {
                strengthBar.style.width = '33%';
                strengthBar.className = 'progress-bar bg-danger';
                strengthText.innerText = 'Zayıf Şifre';
                strengthText.className = 'small text-danger mt-1';
            } else if (passed === 2) {
                strengthBar.style.width = '66%';
                strengthBar.className = 'progress-bar bg-warning';
                strengthText.innerText = 'Orta Derece';
                strengthText.className = 'small text-warning mt-1';
            } else if (passed === 3) {
                strengthBar.style.width = '100%';
                strengthBar.className = 'progress-bar bg-success';
                strengthText.innerText = 'Güçlü Şifre (Kurallara Uygun)';
                strengthText.className = 'small text-success mt-1';
            }
        });

        // --- ÖNERİ 3: REGISTER CAPS LOCK TAKİBİ ---
        function checkRegisterCapsLock(e) {
            const capsWarning = document.getElementById('capsWarningRegister');
            if (e.getModifierState('CapsLock')) {
                capsWarning.classList.remove('d-none');
            } else {
                capsWarning.classList.add('d-none');
            }
        }
        sifreInput.addEventListener('keyup', checkRegisterCapsLock);
        sifreInput.addEventListener('keydown', checkRegisterCapsLock);

        // --- BACKEND BAĞLANTISI VE YÖNLENDİRME ---
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const ad = document.getElementById('ad').value.trim();
            const soyad = document.getElementById('soyad').value.trim();
            const email = document.getElementById('mail').value.trim();
            const plate_number = document.getElementById('plaka').value.trim();
            const password = document.getElementById('sifre').value.trim();

            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(password)) {
                alert("Lütfen şifrenizin en az 8 karakter, 1 büyük harf ve 1 rakam içerdiğinden emin olun.");
                return;
            }

            const username = ad + " " + soyad;
            const regBtn = document.getElementById('regBtn');

            regBtn.disabled = true;
            regBtn.innerText = "Kayıt Yapılıyor...";

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, plate_number })
            })
            .then(response => {
                if(response.status === 201) {
                    alert("Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz.");
                    window.location.href = 'login.html'; 
                } else {
                    return response.json().then(data => {
                        alert(data.error || "Bir hata oluştu");
                        regBtn.disabled = false;
                        regBtn.innerText = "Kayıt İşlemini Tamamla";
                    });
                }
            })
            .catch(err => {
                alert("Sunucu hatası! Lütfen backend'i kontrol et.");
                regBtn.disabled = false;
                regBtn.innerText = "Kayıt İşlemini Tamamla";
            });
        });

        // --- ŞİFRE GÖSTER/GİZLE İŞLEMİ (REGISTER) ---
        document.getElementById('toggleSifre').addEventListener('click', function () {
            const sifreInput = document.getElementById('sifre');
            if (sifreInput.disabled) return; 
            
            const type = sifreInput.getAttribute('type') === 'password' ? 'text' : 'password';
            sifreInput.setAttribute('type', type);
            this.textContent = type === 'password' ? 'Göster' : 'Gizle';
        });
    </script>
<script src="../js/auth.js?v=2"></script>
</body>
</html>
