<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkron | Yönetici Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.4); }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }
        .form-control:disabled {
            background: rgba(255, 255, 255, 0.01);
            border-color: transparent;
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px #0ea5e9;
        }
        .btn-primary:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .brand-logo { font-weight: 800; letter-spacing: 3px; color: #38bdf8; }
        .forgot-link { color: #94a3b8; transition: color 0.3s; }
        .forgot-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card glass-card p-4 p-sm-5">
                    <div class="card-body p-0">
                        <div class="text-center mb-5">
                            <h2 class="brand-logo mb-1">SENKRON</h2>
                            <p class="text-secondary small text-uppercase fw-bold">Akıllı Otopark Sistemi</p>
                        </div>
                        
                        <form id="loginForm" onsubmit="event.preventDefault();">
                            <div class="mb-4">
                                <label class="form-label small text-uppercase text-secondary fw-bold">E-posta Adresi</label>
                                <input type="email" class="form-control" id="email" placeholder="ornek@sirket.com" autocomplete="off">
                            </div>
                            
                            <div class="mb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label class="form-label small text-uppercase text-secondary fw-bold">Şifre</label>
                                    <a href="#" class="text-decoration-none small forgot-link mb-2">Şifremi Unuttum?</a>
                                </div>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" disabled>
                            </div>
                            
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" disabled>
                                <label class="form-check-label small text-secondary" for="rememberMe">Beni Hatırla</label>
                            </div>
                            
                            <button type="submit" id="loginBtn" class="btn btn-primary w-100" disabled>Sisteme Giriş Yap</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <span class="text-secondary small">Sistemde kaydınız yok mu?</span><br>
                            <a href="register.html" class="text-info text-decoration-none small fw-bold mt-1 d-inline-block">Yeni hesap oluştur →</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const remember = document.getElementById('rememberMe');
        const btn = document.getElementById('loginBtn');

        email.addEventListener('input', () => {
            const isValid = email.value.includes('@') && email.value.length > 5;
            password.disabled = !isValid;
            if(!isValid) { 
                password.value = ""; 
                remember.disabled = true;
                btn.disabled = true; 
            }
        });

        password.addEventListener('input', () => {
            const isSet = password.value.length >= 4;
            remember.disabled = !isSet;
            btn.disabled = !isSet;
        });
    </script>
</body>
</html><!-- Login Page Template -->
