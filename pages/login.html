<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkron | Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 3px;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card glass-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="brand-logo mb-1">SENKRON</h2>
                        <p class="text-secondary small text-uppercase fw-bold">Sürücü Girişi</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary fw-bold">E-posta</label>
                            <input type="email" class="form-control" id="email" placeholder="ornek@mail.com" required>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small text-uppercase text-secondary fw-bold mb-0">Şifre</label>
                                <a href="sifremi-unuttum.html" class="text-info text-decoration-none small fw-bold">Şifremi Unuttum?</a>
                            </div>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <div id="passwordHelp" class="form-text text-secondary opacity-75 mt-2" style="font-size: 0.75rem;">
                                * Şifreniz en az 8 karakter, 1 büyük harf ve 1 rakam içermelidir.
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary w-100">Giriş Yap</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <span class="text-secondary small">Henüz hesabınız yok mu?</span><br>
                        <a href="register.html"
                            class="text-info text-decoration-none small fw-bold mt-1 d-inline-block">Yeni kayıt oluştur
                            →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            // --- YENİ EKLENEN KISIM: ŞİFRE KONTROLÜ ---
            // Şifrenin en az 8 karakter, 1 büyük harf ve 1 rakam içerip içermediğini kontrol eder.
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(password)) {
                alert("Lütfen şifrenizin en az 8 karakter, 1 büyük harf ve 1 rakam içerdiğinden emin olun.");
                return; // Kurallara uymazsa işlemi durdurur.
            }
            // ------------------------------------------

            loginBtn.disabled = true;
            loginBtn.innerText = "Giriş Yapılıyor...";

            // server.js üzerindeki login API'sine bağlanıyoruz
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        return response.json().then(data => { throw new Error(data.error); });
                    }
                })
                .then(data => {
                    alert("Giriş başarılı! Hoş geldin, " + data.user.username);

                    // Kullanıcı bilgisini tarayıcıya kaydet (Anasayfada kullanmak için)
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // KRİTİK: Bir üst klasördeki (root) index.html'e yönlendirir
                    localStorage.setItem('username', data.user.username);
                    window.location.href = '../index.html';
                })
                .catch(err => {
                    alert("Hata: " + err.message);
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Giriş Yap";
                });
        });
    </script>
    <script src="../js/auth.js?v=2"></script>
</body>

</html>
