<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senkron | Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 3px;
            color: #38bdf8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card glass-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="brand-logo mb-1">SENKRON</h2>
                        <p class="text-secondary small text-uppercase fw-bold">Sürücü Girişi</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small text-uppercase text-secondary fw-bold">E-posta</label>
                            <input type="email" class="form-control" id="email" placeholder="ornek@mail.com" required>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small text-uppercase text-secondary fw-bold mb-0">Şifre</label>
                                <a href="sifremi-unuttum.html" class="text-info text-decoration-none small fw-bold">Şifremi Unuttum?</a>
                            </div>
                            <div class="position-relative">
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required style="padding-right: 70px;">
                                <button type="button" id="togglePassword" class="btn position-absolute top-50 end-0 translate-middle-y text-info fw-bold" style="background: transparent; border: none; box-shadow: none; font-size: 0.85rem; padding-right: 15px;">Göster</button>
                            </div>
                            <div id="capsWarning" class="text-warning small mt-1 d-none" style="font-size: 0.75rem;">
                                ⚠️ Uyarı: Caps Lock Açık!
                            </div>

                        </div>

                        <div class="mb-3 form-check d-flex align-items-center">
                            <input type="checkbox" class="form-check-input" id="rememberMe" style="cursor: pointer; background-color: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);">
                            <label class="form-check-label small text-secondary fw-bold ms-2 mb-0" for="rememberMe" style="cursor: pointer; user-select: none;">Beni Hatırla</label>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary w-100">Giriş Yap</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <span class="text-secondary small">Henüz hesabınız yok mu?</span><br>
                        <a href="register.html" class="text-info text-decoration-none small fw-bold mt-1 d-inline-block">Yeni kayıt oluştur →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SAYFA YÜKLENDİĞİNDE: BENİ HATIRLA KONTROLÜ ---
        const savedEmail = localStorage.getItem('rememberedEmail');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
            document.getElementById('rememberMe').checked = true;
        }

        // --- ÖNERİ 3: CAPS LOCK TAKİBİ ---
        const passwordInput = document.getElementById('password');
        const capsWarning = document.getElementById('capsWarning');
        
        function checkCapsLock(e) {
            if (e.getModifierState('CapsLock')) {
                capsWarning.classList.remove('d-none');
            } else {
                capsWarning.classList.add('d-none');
            }
        }
        passwordInput.addEventListener('keyup', checkCapsLock);
        passwordInput.addEventListener('keydown', checkCapsLock);

        // --- GİRİŞ YAPMA VE ŞİFRE KONTROL İŞLEMİ ---
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');



            loginBtn.disabled = true;
            loginBtn.innerText = "Giriş Yapılıyor...";

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        return response.json().then(data => { throw new Error(data.error); });
                    }
                })
                .then(data => {
                    alert("Giriş başarılı! Hoş geldin, " + data.user.username);
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('username', data.user.username);
                    
                    const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
                    if (!passwordRegex.test(password)) {
                        localStorage.setItem('mustChangePassword', 'true');
                        window.location.href = 'sifre-guncelle.html';
                    } else {
                        localStorage.removeItem('mustChangePassword');
                        window.location.href = '../index.html';
                    }
                })
                .catch(err => {
                    alert("Hata: " + err.message);
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Giriş Yap";
                });
        });

        // --- ŞİFRE GÖSTER/GİZLE İŞLEMİ ---
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwdInput = document.getElementById('password');
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);
            this.textContent = type === 'password' ? 'Göster' : 'Gizle';
        });
    </script>
    <script src="../js/auth.js?v=2"></script>
</body>

</html>
